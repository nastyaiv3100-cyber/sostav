/* Scene surrounds a central scrolling worksheet. */
body{height:100dvh;overflow:hidden;background:#a2cfbc}
body:before{content:'';position:fixed;inset:0 0 0 76px;background-image:var(--scene);background-size:100% 100%;background-position:center;pointer-events:none;z-index:-1}
.side{width:76px;padding:16px 6px;background:#302447f2;scrollbar-width:thin}
.logo{font-size:9px;letter-spacing:0;text-align:center}.side h2{font-size:13px;text-align:center;margin:12px 0}.side nav button{font-size:0;text-align:center;padding:7px 2px;margin:2px 0;border-radius:9px}.side nav button:before{content:attr(data-n);font-size:15px}.side nav button.done:after{font-size:12px}.side .small{font-size:10px;text-align:center}.side #reset{font-size:10px;padding:8px 3px}.side progress{height:7px}

/* Illustration rails never intersect the worksheet. */
:root{--navw:76px;--sheet:min(850px,calc((100vw - 76px)*.62));--rail:calc((100vw - var(--navw) - var(--sheet))/2)}
body{background:#ebe3d8}body:before{background-image:none;background:#eee5d5;inset:0;z-index:-2}
.edgeScene{position:fixed;bottom:0;width:calc(var(--rail) - 6px);aspect-ratio:500/1024;background-image:var(--scene);background-size:307.2% 100%;background-repeat:no-repeat;pointer-events:none;z-index:-1}.edgeScene.left{left:var(--navw);background-position:left bottom}.edgeScene.right{right:0;background-position:right bottom}
main{margin-left:var(--navw);width:calc(100% - var(--navw));padding:22px calc(var(--rail) + 10px);max-width:none}.side h2{color:#fff3df}
@media(min-width:1700px){main{padding-left:calc(var(--rail) + 10px);padding-right:calc(var(--rail) + 10px)}}
@media(max-width:1100px){:root{--sheet:calc((100vw - 76px)*.68)}main{padding:16px calc(var(--rail) + 7px)}}

body{background:#eee1c5}.side{background:#45452b}.side h2{font-size:13px;overflow-wrap:anywhere}.side nav button.active{background:#f3e6cb;color:#511c22}.side nav button.done:after{color:#bfcba2}.top{background:#f8efddec;color:#641f25}.toolbar{background:#e9dfc9f5}.pageWrap{background:#fffaf0}.exercise{background:#f6efdf}h1,h2{color:#641f25}.primary{background:#641f25!important}.rule,.hint,.solution{background:#e7eadb}.word.chosen{background:#e2e7cf;color:#363e24;border-color:#67734e}.sceneFrame{border-image-slice:125 470 170 470 fill;border-width:65px var(--rail) 75px;border-image-width:65px var(--rail) 75px}main{height:calc(100dvh - 130px);margin-top:60px;margin-bottom:70px}.top{padding:10px 15px}.sectionJump{background:#f8efddf5}.sectionCards{grid-template-columns:1fr 1fr}.scratchBox{height:300px}.lead{font-size:24px}.exercise label{white-space:pre-line}.sample p{white-space:pre-line}.side nav{max-height:none;flex:1;min-height:0}.side{display:flex;flex-direction:column}.side nav button{flex-shrink:0}.side progress{flex-shrink:0}.side .logo{flex-shrink:0}.side h2{flex-shrink:0}.side #reset{flex-shrink:0}.word{min-height:44px}

:root{--ink:#233449;--purple:#4d6080;--line:#d4c4b3}.side{background:#354862}.pageWrap{background:#fffaf2}h1,h2{color:#354862}h1{font-family:Arial,sans-serif;font-weight:800}.top{color:#354862;background:#f7eee4f5}.primary{background:#4d6080!important;color:white!important}.primary:hover{background:#354862!important}.exercise{background:#f7eee3}.rule,.hint{background:#e3edf5}.word.chosen{background:#ffdfc5;color:#66300b;border-color:#d96415}.word{font-size:27px}.exercise label{font-size:27px}.exercise input{font-size:29px;max-width:180px;text-align:center}.sectionCards{grid-template-columns:1fr 1fr}.side nav button.active{background:#f6dcc6;color:#24374c}.side h2{font-family:Arial,sans-serif}.eyebrow{color:#4d6080}.chip{background:#e9d9ca;color:#354862}.score{color:#354862}.counter{border-radius:50%;width:54px;height:54px;font-size:19px;border:3px solid white;box-shadow:0 1px 5px #0003}.c0{background:#4d6080;color:white}.c1{background:#f4721e;color:#221209}.counters{display:flex;gap:8px;flex-wrap:wrap}.bond{font-size:36px;font-weight:bold}.sceneFrame{border-image-slice:70 440 70 570 fill}.scratchBox{background-image:linear-gradient(#ced9e4 1px,transparent 1px),linear-gradient(90deg,#ced9e4 1px,transparent 1px);background-size:26px 26px}.side .small{color:white}.word.chosen:before{content:'✓ ';font-size:20px}.result.good{border-left:4px solid #45825d}.result.bad{border-left:4px solid #b44b34}@media(max-width:550px){.exercise label{font-size:23px}.word{font-size:23px}.counter{width:44px;height:44px}.sectionCards{grid-template-columns:1fr}}

function controls(t){let c=state.checks[state.page];return `<div class="actions"><button class="primary" onclick="${t.type==='open'?'selfCheck()':'check()'}">${t.type==='open'?'Я сравнил(а) с образцом':'Проверить'}</button><button onclick="retry()">Повторная попытка</button><button onclick="toggleSample()">${state.samples[state.page]?'Скрыть образцы':'Показать образцы'}</button></div><div class="feedback ${state.done[state.page]?'good':''}" id="feedback" role="status">${t.type==='open'?(state.done[state.page]?'Самопроверка выполнена.':''):(c?c.ok?'Верно! Все задания этапа выполнены.':`Верно ${c.results.filter(Boolean).length} из ${t.items.length}. Исправь ответ и попробуй ещё раз.`:'')}</div>`}
function notes(){return `<section class="draft"><label for="notes"><b>Мои заметки</b></label><textarea id="notes" placeholder="Примеры, объяснения…" oninput="state.notes[state.page]=this.value;save()">${esc(state.notes[state.page])}</textarea><h2 style="margin-top:20px">Черновик</h2><p class="small muted">Рисуй здесь сразу. Цвет и толщина — в верхней панели. Для работы с кнопками выключи рисование поверх страницы.</p><div class="draftbar"><button id="draftPen" onclick="draftErase=false;draftUI()">Карандаш</button><button id="draftEraser" onclick="draftErase=true;draftUI()">Ластик</button><button onclick="state.drafts[state.page]=[];paint($('scratch'),'drafts');save()">Очистить черновик</button></div><div class="scratchBox"><canvas id="scratch" aria-label="Черновик к заданиям"></canvas></div></section>`}
function blockHTML(t){return `<div class="eyebrow">${t.group} · этап ${state.page-1} / ${blocks.length}</div><h1>${t.title}</h1><p class="instruction">${t.desc}</p>${t.abacus?abacusHTML():''}<details class="rule"><summary>Вспомнить правило</summary><p>${rules[t.group]}</p></details>`+t.items.map((q,i)=>{let v=answers()[i],r=state.checks[state.page]?.results?.[i];let content=t.type==='multi'?`<div class="words">${q.words.map((word,j)=>`<button class="word ${(v||[]).includes(j)?'chosen':''}" aria-pressed="${(v||[]).includes(j)}" onclick="chooseWord(${i},${j})">${esc(word)}</button>`).join('')}</div><p class="small muted">Нажми на слово, чтобы выбрать. Нажми ещё раз, чтобы убрать выбор.</p>`:t.type==='choice'?`<select id="q${i}" onchange="update('${i}',this.value)"><option value="">Выбери ответ</option>${q.options.map((o,j)=>`<option value="${j}" ${String(v)===String(j)?'selected':''}>${esc(o)}</option>`).join('')}</select>`:t.type==='text'?`<input id="q${i}" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" value="${esc(v)}" oninput="update('${i}',this.value)" placeholder="Впиши число">`:`<textarea id="q${i}" spellcheck="true" oninput="update('${i}',this.value)" placeholder="Запиши свой вариант…">${esc(v)}</textarea>`;return `<section class="exercise"><span class="eyebrow">Задание ${i+1}</span><label ${t.type==='multi'?'':`for="q${i}"`}>${esc(q.text)}</label>${content}${r===undefined?'':`<p class="result ${r?'good':'bad'}">${r?'Верно.':'Пока неверно. Проверь: части вместе должны дать целое.'}</p>`}${state.samples[state.page]?`<div class="sample"><b>${t.type==='open'?'Возможный вариант':'Ответ'}</b><p>${esc(q.sample||answerText(q,t))}</p></div>`:''}</section>`}).join('')+controls(t)+notes()}
function render(){let p=state.page,t=task(),h='';if(p===0)h=`<div class="eyebrow">Зимняя экспедиция</div><h1>Состав числа</h1><p class="lead">Математика</p><p>Помоги лису, зайке и ледяному змею зажечь зимние фонарики! Учись составлять числа от 2 до 10 из двух частей.</p><div class="chips"><span class="chip">Числа 2–10</span><span class="chip">18 этапов</span><span class="chip">111 заданий</span></div><p class="muted">Для каждого числа — два шага: заполни домик, затем реши примеры со счётами. Можно начать с любого числа.</p><div class="actions"><button class="primary" onclick="go(2)">Открыть домик числа 2 →</button></div><div class="sectionCards">${groups.map(g=>`<button onclick="go(${blocks.findIndex(b=>b.group===g)+2})">${g}<span>${blocks.filter(b=>b.group===g).length} этапов</span></button>`).join('')}</div>`;else if(p===1)h=`<div class="eyebrow">Памятка и опыт</div><h1>Целое и две части</h1><p>Перед тобой 6 фишек. Нажимай на фишки: меняй их цвет и получай новые пары.</p><div id="counters" class="counters"></div><p id="bond" class="bond"></p><p>Синие фишки — первая часть. Оранжевые — вторая. Всего всегда 6.</p><section class="exercise"><h2>Запомни</h2><p>2 + 4 = 6<br>4 + 2 = 6<br>6 − 2 = 4<br>6 − 4 = 2</p><p>Части можно поменять местами — целое останется тем же.</p><p>6 + 0 = 6. Ноль означает, что в этой группе нет фишек.</p></section>`;else if(t)h=t.house?houseHTML(t):blockHTML(t);else{let totalClosed=blocks.filter(b=>b.type!=='open').reduce((n,b)=>n+b.items.length,0),right=blocks.reduce((n,b,i)=>n+(b.type!=='open'?(state.checks[i+2]?.results||[]).filter(Boolean).length:0),0),openTotal=blocks.filter(b=>b.type==='open').length,openDone=blocks.filter((b,i)=>b.type==='open'&&state.done[i+2]).length;h=`<div class="eyebrow">Зимняя экспедиция</div><h1>Твои результаты</h1><div class="score">${right} / ${totalClosed}</div><p>карточек с автопроверкой выполнено верно.</p><p>Сначала домики, затем примеры — повторяй в удобном темпе.</p><div class="sectionCards">${groups.map(g=>{let indices=blocks.map((b,i)=>b.group===g?i:-1).filter(i=>i>=0);return `<button onclick="go(${indices[0]+2})">${g}<span>${indices.filter(i=>state.done[i+2]).length} / ${indices.length} этапов</span></button>`}).join('')}</div><p class="small muted">Урок на Play · Орлова А. Р.</p>`}$('page').innerHTML=h;if(p===1)drawCounters();if(t?.abacus){drawAbacus();bindBeads()}nav();$('back').disabled=p===0;$('next').disabled=p===titles.length-1;$('pageCount').textContent=`Экран ${p+1} из ${titles.length}`;if($('scratch')){bind($('scratch'),'drafts');draftUI()}requestAnimationFrame(resizeAll);save()}
function go(p){active=null;state.page=Math.max(0,Math.min(titles.length-1,p));render();document.querySelector('main').scrollTop=0;window.scrollTo(0,0)}function toggleSample(){state.samples[state.page]=!state.samples[state.page];render()}function check(){let t=task(),a=answers(),results=t.items.map((q,i)=>{let v=a[i];if(t.type==='multi')return Array.isArray(v)&&v.length===q.answer.length&&q.answer.every(x=>v.includes(x));if(t.type==='choice')return String(v)===String(q.answer);return norm(v)===norm(q.answer)});let ok=results.every(Boolean);state.checks[state.page]={results,ok};state.done[state.page]=ok;beep(ok);render()}
function selfCheck(){if(!task().items.every((_,i)=>norm(answers()[i]))){$('feedback').textContent='Сначала запиши ответы ко всем заданиям этапа.';return}if(!state.samples[state.page]){state.samples[state.page]=true;render();$('feedback').textContent='Сравни ответы с образцами, затем отметь самопроверку. Твой верный вариант может отличаться.';return}state.done[state.page]=true;beep(true);render()}function retry(){delete state.answers[state.page];delete state.checks[state.page];delete state.done[state.page];render()}

function drawCounters(){let a=state.answers.memo||[0,0,1,1,1,1];let blue=a.filter(v=>v===0).length;$('counters').innerHTML=a.map((v,i)=>`<button class="counter c${v}" aria-label="Фишка ${i+1}: ${v?'оранжевая':'синяя'}" onclick="flipCounter(${i})">${v?'О':'С'}</button>`).join('');$('bond').textContent=blue+' + '+(6-blue)+' = 6'}function flipCounter(i){let a=state.answers.memo||[0,0,1,1,1,1];a[i]=1-a[i];state.answers.memo=a;drawCounters();save()}


function partsValue(){let n=task().house;return state.explore[state.page]??1}
function paintParts(){let n=task().house,a=partsValue();$('partCounters').innerHTML=Array.from({length:n},(_,i)=>`<button class="counter c${i<a?0:1}" aria-label="Перенести фишку ${i+1} в другую группу" onclick="changeParts(${i<a?a-1:a+1})">${i<a?'С':'О'}</button>`).join('');$('partWords').textContent=`${a} и ${n-a} — это ${n}`;$('partEquation').textContent=`${a} + ${n-a} = ${n}`;$('lessPart').disabled=a===0;$('morePart').disabled=a===n;$('partExplain').textContent=a===0||a===n?'Одна группа пустая. В ней 0 фишек. Все фишки — в другой группе.':'Синие фишки — одна часть. Оранжевые — другая. Посчитай каждую группу.'}
function changeParts(a){state.explore[state.page]=Math.max(0,Math.min(task().house,a));paintParts();save()}
function houseHTML(t){let n=t.house;return `<div class="eyebrow">${t.group} · сначала разберёмся</div><h1>${t.title}</h1><p class="instruction">В каждом этаже два числа. Вместе они дают ${n}. Впиши недостающее число.</p><div class="numberHouse"><div class="houseRoof"><span>${n}</span><small>целое</small></div><div class="houseFloors">${t.items.map((q,i)=>{let r=state.checks[state.page]?.results?.[i];return `<div class="floor"><span class="neighbor">${q.left}</span><span class="and">и</span><label class="srOnly" for="q${i}">Сосед числа ${q.left}, чтобы получилось ${n}</label><input id="q${i}" inputmode="numeric" autocomplete="off" value="${esc(answers()[i])}" placeholder="?" oninput="update('${i}',this.value)">${r===undefined?'':`<span class="result ${r?'good':'bad'}">${r?'Верно':'Проверь'}</span>`}</div>`}).join('')}</div></div>${state.samples[state.page]?`<div class="sample"><b>Проверяем соседей</b><p>${t.items.map(q=>`${q.left} + ${q.answer} = ${n}`).join('<br>')}</p></div>`:''}${controls(t)}<p class="muted">Когда разберёшься с домиком, нажми «Далее» — тебя ждут примеры.</p>${notes()}`}


function abacusHTML(){return `<section class="abacusPanel"><h2>Счёты-помощники</h2><p>Перетащи шарик вправо или нажми на него. Чтобы убрать шарик справа, верни его влево.</p><div class="abacusLabels"><span>Слева: <b id="leftCount">10</b></span><span>Справа: <b id="rightCount">0</b></span></div><div class="abacusTrack" id="abacusTrack" aria-label="Счёты с десятью шариками"><div class="rod"></div><div id="beads"></div></div><p class="abacusResult" id="abacusResult" role="status"></p><p id="abacusNote" class="small"></p><button onclick="resetAbacus()">Все шарики влево</button><details class="abacusHelp"><summary>Как посчитать 2 + 1?</summary><p>Передвинь вправо 2 шарика. Затем ещё 1. Справа получится 3 шарика: 2 + 1 = 3.</p><p>Для вычитания 3 − 1 сначала передвинь 3 шарика вправо, затем верни 1 влево. Справа останется 2.</p></details></section>`}
function drawAbacus(){let r=state.abacus[state.page]||0,l=10-r;$('leftCount').textContent=l;$('rightCount').textContent=r;$('abacusResult').textContent='Справа '+r;$('abacusNote').textContent=state.abacusNote[state.page]||'Начни с нуля: все шарики слева.';$('beads').innerHTML=Array.from({length:10},(_,i)=>{let right=i>=l,pos=right?98-(10-i)*7.5:2+i*7.5;return `<button class="bead ${right?'beadRight':''}" data-side="${right?'right':'left'}" style="left:${pos}%" aria-label="Шарик ${i+1}: ${right?'справа, вернуть влево':'слева, передвинуть вправо'}"></button>`}).join('')}
function moveBead(direction){let old=state.abacus[state.page]||0,n=Math.max(0,Math.min(10,old+direction));state.abacus[state.page]=n;state.abacusNote[state.page]=n===old?'Больше шариков в этой группе нет.':`${old} ${direction>0?'+':'−'} 1 = ${n}`;drawAbacus();bindBeads();save()}
function resetAbacus(){state.abacus[state.page]=0;state.abacusNote[state.page]='Все шарики слева. Справа 0.';drawAbacus();bindBeads();save()}
function bindBeads(){document.querySelectorAll('.bead').forEach(b=>{let start=null,dragged=false;b.onpointerdown=e=>{start=e.clientX;dragged=false;b.setPointerCapture(e.pointerId)};b.onpointermove=e=>{if(start!==null){let dx=e.clientX-start;dragged=Math.abs(dx)>8;b.style.transform=`translateX(${Math.max(-80,Math.min(80,dx))}px)`}};b.onpointerup=e=>{let dx=e.clientX-start;start=null;b.style.transform='';if(dragged){let side=b.dataset.side;if(dx>8&&side==='left')moveBead(1);else if(dx< -8&&side==='right')moveBead(-1)}};b.onpointercancel=()=>{start=null;dragged=true;b.style.transform=''};b.onclick=()=>{if(dragged){dragged=false;return}moveBead(b.dataset.side==='left'?1:-1)}})}

function draftUI(){$('draftPen')?.classList.toggle('selected',!draftErase);$('draftEraser')?.classList.toggle('selected',draftErase)}
function resize(c,k){if(!c)return;let r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);c.getContext('2d').setTransform(d,0,0,d,0,0);paint(c,k)}function resizeAll(){resize($('overlay'),'ink');resize($('scratch'),'drafts')}
function paint(c,k){if(!c)return;let ctx=c.getContext('2d'),w=c.clientWidth,h=c.clientHeight;ctx.clearRect(0,0,w,h);for(let s of state[k][state.page]||[]){ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';ctx.strokeStyle=s.color;ctx.fillStyle=s.color;ctx.lineWidth=s.width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();s.points.forEach((p,i)=>i?ctx.lineTo(p[0]*w,p[1]*h):ctx.moveTo(p[0]*w,p[1]*h));if(s.points.length===1){let p=s.points[0];ctx.arc(p[0]*w,p[1]*h,s.width/2,0,Math.PI*2);ctx.fill()}else ctx.stroke()}ctx.globalCompositeOperation='source-over'}
function bind(c,k){function point(e){let r=c.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}c.onpointerdown=e=>{if(k==='ink'&&!mode)return;e.preventDefault();c.setPointerCapture(e.pointerId);let er=k==='ink'?erase:draftErase;active={canvas:c,kind:k,stroke:{erase:er,color:$('color').value,width:+$('thick').value*(er?4:1),points:[point(e)]}};(state[k][state.page]??=[]).push(active.stroke);paint(c,k)};c.onpointermove=e=>{if(active?.canvas===c){active.stroke.points.push(point(e));paint(c,k)}};c.onpointerup=c.onpointercancel=c.onlostpointercapture=()=>{if(active?.canvas===c){active=null;save()}}}
function modeUI(){$('overlay').classList.toggle('on',mode);$('pen').textContent='Поверх страницы: '+(mode?'вкл.':'выкл.');$('pen').setAttribute('aria-pressed',mode);$('pen').classList.toggle('selected',mode&&!erase);$('eraser').classList.toggle('selected',mode&&erase);$('drawNote').textContent=mode?'Для ввода ответов выключи рисование.':''}
$('pen').onclick=()=>{mode=!mode;erase=false;modeUI()};$('eraser').onclick=()=>{mode=true;erase=!erase;modeUI()};$('clearPage').onclick=()=>{state.ink[state.page]=[];paint($('overlay'),'ink');save()};$('sound').onclick=()=>{sound=!sound;$('sound').textContent='Звук: '+(sound?'включён':'выключен');$('sound').setAttribute('aria-pressed',sound);beep(true)};$('back').onclick=()=>go(state.page-1);$('next').onclick=()=>go(state.page+1);$('reset').onclick=()=>$('resetDialog').showModal();$('cancelReset').onclick=()=>$('resetDialog').close();$('confirmReset').onclick=()=>{state=fresh();mode=false;erase=false;draftErase=false;active=null;modeUI();$('resetDialog').close();render()};bind($('overlay'),'ink');new ResizeObserver(resizeAll).observe($('wrap'));render();
</script></body></html>
